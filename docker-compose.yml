name: nexus-fullstack
include:
  - path: ./Proyecto_Springboot_Microservicios/proyecto/docker-compose.yml
    env_file: ./.env

services:
  frontend:
    restart: unless-stopped
    build:
      context: ./Nexus_React
      args:
        VITE_ICE_SERVERS: '${VITE_ICE_SERVERS:-[]}'
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api-gateway
    networks:
      - foodexpress-net
