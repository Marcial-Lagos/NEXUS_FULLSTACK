      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      EUREKA_DEFAULT_ZONE: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-XX:InitialRAMPercentage=10.0 -XX:MaxRAMPercentage=65.0"
